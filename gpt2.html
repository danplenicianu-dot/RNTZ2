<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Lista Ray</title><style>:root{color-scheme:dark;--text:#f7f1dd;--muted:#9e967f;--gold:#d8b45c;--panel:rgba(18,18,18,.92);--focus:#fff2b8;--done:#79e6a3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{width:100vw;height:100vh;max-width:600px;max-height:600px;margin:0 auto;padding:22px;background:#000;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:17px;letter-spacing:.16em;font-weight:900}.dot{width:10px;height:10px;border-radius:99px;background:var(--gold)}h1{font-size:45px;line-height:.96;margin:0 0 2px;letter-spacing:-.04em}.list{display:flex;flex-direction:column;gap:15px}.item{font:inherit;width:100%;min-height:88px;border:1px solid rgba(216,180,92,.28);border-radius:24px;background:var(--panel);color:var(--text);font-size:31px;font-weight:950;padding:16px 20px;text-align:left;outline:none;display:flex;align-items:center;gap:16px}.box{width:38px;height:38px;border-radius:11px;border:2px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;background:transparent;flex:0 0 auto}.item.done{opacity:.50;color:var(--muted);text-decoration:line-through}.item.done .box{background:var(--done);border-color:var(--done)}.item.done .box:after{content:'✓';font-weight:1000;color:#07150d}.focused,.focusable:focus{box-shadow:0 0 0 4px rgba(255,242,184,.28),0 0 20px rgba(216,180,92,.58);border-color:var(--focus);transform:translateY(-1px)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}.small{font:inherit;min-height:58px;border:1px solid rgba(216,180,92,.28);border-radius:18px;background:rgba(18,18,18,.94);color:var(--text);font-size:18px;font-weight:900;padding:10px;outline:none}.primary{background:#d8b45c;color:#151006;border-color:#d8b45c}@media(max-width:420px),(max-height:420px){.app{padding:16px;gap:13px}h1{font-size:36px}.item{font-size:24px;min-height:68px;border-radius:20px}.box{width:30px;height:30px}.small{font-size:16px;min-height:48px}}</style></head><body><main class="app"><div class="top"><span class="dot"></span><span>LISTA RAY</span></div><h1>Cumpărături</h1><div class="list"><button class="focusable item" data-name="Kent"><span class="box"></span><span>Kent</span></button><button class="focusable item" data-name="Vogue"><span class="box"></span><span>Vogue</span></button><button class="focusable item" data-name="Bere"><span class="box"></span><span>Bere</span></button><button class="focusable item" data-name="Semințe"><span class="box"></span><span>Semințe</span></button></div><div class="actions"><button id="reset" class="focusable small primary">Resetează</button><button id="hide" class="focusable small">Ascunde bifate</button></div></main><script>const items=[...document.querySelectorAll('.focusable')],products=[...document.querySelectorAll('.item')],reset=document.getElementById('reset'),hide=document.getElementById('hide');let i=0,hideDone=false;const key='ray.shopping.done.gpt2.v2';let done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){done={}}function save(){localStorage.setItem(key,JSON.stringify(done))}function visible(){return items.filter(e=>e.style.display!=='none')}function focusIt(){const v=visible();document.querySelectorAll('.focused').forEach(e=>e.classList.remove('focused'));if(!v.length)return;i=Math.max(0,Math.min(i,v.length-1));v[i].classList.add('focused');try{v[i].focus({preventScroll:true})}catch(e){}}function refresh(){products.forEach(p=>{const d=!!done[p.dataset.name];p.classList.toggle('done',d);p.style.display=hideDone&&d?'none':'flex'});focusIt()}function move(d){const v=visible();if(!v.length)return;i=(i+d+v.length)%v.length;focusIt()}products.forEach(p=>p.onclick=()=>{done[p.dataset.name]=!done[p.dataset.name];save();refresh()});reset.onclick=()=>{done={};save();hideDone=false;hide.textContent='Ascunde bifate';refresh()};hide.onclick=()=>{hideDone=!hideDone;hide.textContent=hideDone?'Arată toate':'Ascunde bifate';i=0;refresh()};document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='Enter'){e.preventDefault();visible()[i]?.click()}});window.onload=refresh;</script></body></html>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Domnul Dan TCL Remote</title>
<style>
:root{--bg:#050505;--panel:#141414;--panel2:#202020;--text:#fff6e6;--muted:#b8ab93;--gold:#d7b46a;--gold2:#ffe0a0;--red:#ff6961;--green:#70e28d;--r:28px}*{box-sizing:border-box}html,body{width:600px;height:600px;margin:0;overflow:hidden;background:#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}button,input{font:inherit}.app{width:600px;height:600px;padding:22px;display:grid;grid-template-rows:70px 92px 214px 64px 70px 48px 20px;gap:10px;background:radial-gradient(circle at 50% 0%,rgba(215,180,106,.18),transparent 38%),linear-gradient(180deg,#090909,#020202)}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:var(--gold);font-size:17px;letter-spacing:.12em;text-transform:uppercase}h1{margin:2px 0 0;font-size:38px;line-height:1}.status{padding:10px 14px;border-radius:999px;font-weight:800;font-size:17px;background:#291111;color:var(--red)}.status.online{background:#102418;color:var(--green)}.hero,.volume,.apps,.config{display:grid;gap:10px}.hero{grid-template-columns:1fr 1fr 1fr}.tile,.pill,.appbtn,.small,.round{border:1px solid rgba(215,180,106,.28);color:var(--text);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--r);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.28)}.tile{min-height:86px;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tile span{font-size:16px;color:var(--muted)}.danger{color:var(--red)}.dpad{position:relative;display:grid;place-items:center}.round{width:80px;height:80px;border-radius:50%;font-size:30px;position:absolute}.round.ok{width:104px;height:104px;font-size:28px;font-weight:900;color:#1b1303;background:linear-gradient(180deg,var(--gold2),var(--gold))}.up{top:2px;left:238px}.down{bottom:2px;left:238px}.left{left:130px;top:68px}.right{right:130px;top:68px}.center{left:226px;top:56px}.volume{grid-template-columns:1fr 1fr 1fr}.pill,.appbtn,.small{min-height:58px;font-size:22px;font-weight:800}.apps{grid-template-columns:1fr 1fr 1fr 1fr}.appbtn{min-height:62px;font-size:18px}.config{grid-template-columns:74px 1fr 112px;align-items:center;background:rgba(255,255,255,.035);padding:8px;border-radius:18px}.config label{color:var(--muted);padding-left:8px;font-weight:800}.config input{height:42px;border-radius:14px;border:1px solid rgba(215,180,106,.22);background:#080808;color:var(--text);padding:0 12px;outline:none}.small{min-height:42px;border-radius:14px;font-size:16px}footer{color:var(--muted);text-align:center;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.focused{border-color:var(--gold2)!important;box-shadow:0 0 0 4px rgba(215,180,106,.28),0 0 26px rgba(215,180,106,.28)!important;transform:translateY(-1px)}.pressed{transform:scale(.96);filter:brightness(1.25)}
</style>
</head>
<body>
<main class="app" aria-label="Telecomanda TCL Android TV">
<header class="top"><div><div class="eyebrow">MRBD Remote</div><h1>TCL TV</h1></div><div id="status" class="status offline">Offline</div></header>
<section class="hero"><button class="tile danger focusable" data-cmd="power">⏻<span>Power</span></button><button class="tile focusable" data-cmd="home">⌂<span>Home</span></button><button class="tile focusable" data-cmd="back">↩<span>Back</span></button></section>
<section class="dpad"><button class="round ghost focusable up" data-cmd="up">▲</button><button class="round ghost focusable left" data-cmd="left">◀</button><button class="round ok focusable center" data-cmd="select">OK</button><button class="round ghost focusable right" data-cmd="right">▶</button><button class="round ghost focusable down" data-cmd="down">▼</button></section>
<section class="volume"><button class="pill focusable" data-cmd="volume_down">− Vol</button><button class="pill focusable" data-cmd="mute">Mute</button><button class="pill focusable" data-cmd="volume_up">Vol +</button></section>
<section class="apps"><button class="appbtn focusable" data-cmd="youtube">YouTube</button><button class="appbtn focusable" data-cmd="netflix">Netflix</button><button class="appbtn focusable" data-cmd="prime">Prime</button><button class="appbtn focusable" data-cmd="settings">Setari</button></section>
<section class="config"><label for="bridgeUrl">Bridge</label><input id="bridgeUrl" class="focusable" value="http://localhost:8787"><button id="saveBridge" class="small focusable">Salveaza</button></section>
<footer id="log">Sagetile + Enter / OK. Necesita bridge local pentru control real.</footer>
</main>
<script>
const DEFAULT_BRIDGE='http://localhost:8787';const COMMANDS={power:'KEYCODE_POWER',home:'KEYCODE_HOME',back:'KEYCODE_BACK',up:'KEYCODE_DPAD_UP',down:'KEYCODE_DPAD_DOWN',left:'KEYCODE_DPAD_LEFT',right:'KEYCODE_DPAD_RIGHT',select:'KEYCODE_DPAD_CENTER',volume_up:'KEYCODE_VOLUME_UP',volume_down:'KEYCODE_VOLUME_DOWN',mute:'KEYCODE_VOLUME_MUTE',settings:'KEYCODE_SETTINGS',youtube:'APP_YOUTUBE',netflix:'APP_NETFLIX',prime:'APP_PRIME'};const statusEl=document.getElementById('status'),logEl=document.getElementById('log'),bridgeInput=document.getElementById('bridgeUrl'),saveBridge=document.getElementById('saveBridge'),focusables=[...document.querySelectorAll('.focusable')];let focusIndex=0,bridgeUrl=localStorage.getItem('bridgeUrl')||DEFAULT_BRIDGE;bridgeInput.value=bridgeUrl;function setLog(t){logEl.textContent=t}function setStatus(o){statusEl.textContent=o?'Online':'Offline';statusEl.classList.toggle('online',o);statusEl.classList.toggle('offline',!o)}function focusAt(i){focusables.forEach(e=>e.classList.remove('focused'));focusIndex=(i+focusables.length)%focusables.length;const e=focusables[focusIndex];e.classList.add('focused');e.focus&&e.focus({preventScroll:true})}function gridMove(d){const c=focusables[focusIndex],r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=-1,score=1e9;focusables.forEach((e,i)=>{if(i===focusIndex)return;const b=e.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,dx=x-cx,dy=y-cy;if(d==='up'&&dy>=-8)return;if(d==='down'&&dy<=8)return;if(d==='left'&&dx>=-8)return;if(d==='right'&&dx<=8)return;const p=(d==='up'||d==='down')?Math.abs(dy):Math.abs(dx),s=(d==='up'||d==='down')?Math.abs(dx):Math.abs(dy),sc=p*1.2+s*2;if(sc<score){score=sc;best=i}});if(best>=0)focusAt(best)}async function sendCommand(cmd){const code=COMMANDS[cmd];if(!code)return;const el=document.querySelector(`[data-cmd="${cmd}"]`);if(el){el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),120)}try{const res=await fetch(`${bridgeUrl.replace(/\/$/,'')}/cmd`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:code})});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();setStatus(true);setLog(data.message||'Trimis: '+cmd)}catch(e){setStatus(false);setLog('Interfata merge. Pentru TV real: bridge pe Mac/PC/Raspberry Pi.')}}async function ping(){try{const res=await fetch(`${bridgeUrl.replace(/\/$/,'')}/health`);setStatus(res.ok)}catch{setStatus(false)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)sendCommand(b.dataset.cmd)});saveBridge.addEventListener('click',()=>{bridgeUrl=bridgeInput.value.trim().replace(/\/$/,'');localStorage.setItem('bridgeUrl',bridgeUrl);setLog('Bridge salvat: '+bridgeUrl);ping()});document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'){e.preventDefault();gridMove('up')}if(k==='ArrowDown'){e.preventDefault();gridMove('down')}if(k==='ArrowLeft'){e.preventDefault();gridMove('left')}if(k==='ArrowRight'){e.preventDefault();gridMove('right')}if(k==='Enter'||k===' '){e.preventDefault();const el=focusables[focusIndex];if(el.dataset.cmd)sendCommand(el.dataset.cmd);else el.click()}});focusables.forEach((el,i)=>el.addEventListener('focus',()=>focusAt(i)));focusAt(0);ping();setInterval(ping,5000);
</script>
</body>
</html>

<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Lista Ray</title><style>:root{color-scheme:dark;--text:#f7f1dd;--muted:#b9ad8a;--gold:#d8b45c;--gold2:#f2d27b;--panel:rgba(22,22,22,.94);--focus:#fff2b8;--done:#7ee0a3}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{width:100vw;height:100vh;max-width:600px;max-height:600px;margin:0 auto;padding:22px;background:radial-gradient(circle at top,rgba(216,180,92,.22),transparent 35%),linear-gradient(#070707,#000);display:flex;flex-direction:column;gap:13px}.top{display:flex;gap:10px;align-items:center;color:var(--gold2);font-size:17px;letter-spacing:.16em;font-weight:900}.dot{width:12px;height:12px;border-radius:99px;background:var(--gold);box-shadow:0 0 18px var(--gold)}h1{font-size:40px;line-height:.96;margin:4px 0 0;letter-spacing:-.04em}.sub{font-size:18px;line-height:1.2;color:var(--muted);margin:0}.list{display:flex;flex-direction:column;gap:12px}.item{font:inherit;width:100%;min-height:78px;border:1px solid rgba(216,180,92,.3);border-radius:22px;background:var(--panel);color:var(--text);font-size:27px;font-weight:950;padding:14px 18px;text-align:left;outline:none;display:flex;align-items:center;gap:14px}.box{width:34px;height:34px;border-radius:10px;border:2px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;color:#101006;background:transparent;flex:0 0 auto}.item.done{opacity:.55;color:var(--muted);text-decoration:line-through}.item.done .box{background:var(--done);border-color:var(--done)}.item.done .box:after{content:'✓';font-weight:1000;color:#07150d}.focused,.focusable:focus{box-shadow:0 0 0 4px rgba(255,242,184,.30),0 0 22px rgba(216,180,92,.62);border-color:var(--focus);transform:translateY(-1px)}.status{flex:1;overflow:auto;background:rgba(22,22,22,.72);border:1px solid rgba(216,180,92,.22);border-radius:22px;padding:16px;font-size:22px;line-height:1.16;white-space:pre-wrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small{font:inherit;min-height:58px;border:1px solid rgba(216,180,92,.3);border-radius:18px;background:rgba(22,22,22,.94);color:var(--text);font-size:18px;font-weight:900;padding:10px;outline:none}.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#151006;border-color:transparent}.hint{color:rgba(247,241,221,.62);font-size:14px;line-height:1.2;margin:0}@media(max-width:420px),(max-height:420px){.app{padding:16px;gap:10px}h1{font-size:31px}.sub{font-size:15px}.item{font-size:22px;min-height:62px;border-radius:18px}.box{width:28px;height:28px}.status{font-size:18px}.small{font-size:16px;min-height:48px}}</style></head><body><main class="app"><div class="top"><span class="dot"></span><span>LISTA RAY</span></div><h1>Cumpărături</h1><p class="sub">Selectezi cu D‑pad. Apeși Enter ca să bifezi / debifezi.</p><div class="list"><button class="focusable item" data-name="Bere"><span class="box"></span><span>Bere</span></button><button class="focusable item" data-name="Țigări Kent"><span class="box"></span><span>Țigări Kent</span></button><button class="focusable item" data-name="Țigări Vogue"><span class="box"></span><span>Țigări Vogue</span></button></div><div class="actions"><button id="reset" class="focusable small primary">Resetează</button><button id="hide" class="focusable small">Ascunde bifate</button></div><div id="status" class="status">0 din 3 bifate.</div><p class="hint">D‑pad sus/jos · Enter: bifează · Reset: debifează tot</p></main><script>const items=[...document.querySelectorAll('.focusable')],products=[...document.querySelectorAll('.item')],status=document.getElementById('status'),reset=document.getElementById('reset'),hide=document.getElementById('hide');let i=0,hideDone=false;const key='ray.shopping.done.v1';let done=JSON.parse(localStorage.getItem(key)||'{}');function save(){localStorage.setItem(key,JSON.stringify(done))}function refresh(){products.forEach(p=>{const d=!!done[p.dataset.name];p.classList.toggle('done',d);p.style.display=hideDone&&d?'none':'flex'});const total=products.length,count=products.filter(p=>done[p.dataset.name]).length;const left=products.filter(p=>!done[p.dataset.name]).map(p=>'• '+p.dataset.name).join('\n')||'Totul este bifat.';status.textContent=count+' din '+total+' bifate.\n\nRămase:\n'+left;focusIt()}function visible(){return items.filter(e=>e.style.display!=='none')}function focusIt(){const v=visible();document.querySelectorAll('.focused').forEach(e=>e.classList.remove('focused'));if(!v.length)return;i=Math.max(0,Math.min(i,v.length-1));v[i].classList.add('focused');try{v[i].focus({preventScroll:true})}catch(e){}}function move(d){const v=visible();if(!v.length)return;i=(i+d+v.length)%v.length;focusIt()}products.forEach(p=>p.onclick=()=>{done[p.dataset.name]=!done[p.dataset.name];save();refresh()});reset.onclick=()=>{done={};save();hideDone=false;hide.textContent='Ascunde bifate';refresh()};hide.onclick=()=>{hideDone=!hideDone;hide.textContent=hideDone?'Arată toate':'Ascunde bifate';i=0;refresh()};document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='Enter'){e.preventDefault();visible()[i]?.click()}});window.onload=refresh;</script></body></html>
